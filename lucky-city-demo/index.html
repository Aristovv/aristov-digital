<body><div class="app" id="app"></div><script>
(function(){
'use strict';
var KEY='lucky_city_public_demo_1';
var MODES=[['plinko','🔮','PLINKO','Удача на каждом шагу'],['mines','💎','MINES','Найди безопасную клетку'],['crash','🚀','CRASH','Успей забрать выигрыш'],['wheel','🎡','LUCKY WHEEL','Колесо подарков']];
var DIST=[['🌃','Neon Street',1],['🎡','Fortune Square',5],['🏙️','Golden District',12],['👑','Royal Heights',25]];
var qs=[['play3','Сыграть 3 раунда',3],['play8','Сыграть 8 раундов',8],['different2','Сыграть в двух режимах',2]];
var state,screen='city',mode='plinko',stake=50,lastResult='',ball=false,toast='',lost=[],tab='season',spinning=false,plinkoSlot=-1,plinkoPath=[],wheelSlot=-1,wheelTurn=0,wheelReveal=false,roundsWon=0;
function fresh(){return {balance:3000,xp:0,spins:0,earned:0,daily:null,wheel:null,streak:0,streakBest:0,modeStats:{},history:[],quests:{date:day(),rounds:0,modes:[],claimed:[]},ach:[],mines:null,crash:null,club:null}}
try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){state=fresh()}
if(!state||typeof state!=='object'||!Number.isSafeInteger(state.balance)||state.balance<0||state.balance>1000000000)state=fresh();
state.streak=Number.isSafeInteger(state.streak)&&state.streak>=0?state.streak:0;
state.streakBest=Number.isSafeInteger(state.streakBest)&&state.streakBest>=0?state.streakBest:0;
if(!state.modeStats||typeof state.modeStats!=='object'||Array.isArray(state.modeStats))state.modeStats={};
if(!Array.isArray(state.ach))state.ach=[];
if(!Array.isArray(state.history))state.history=[];
if(!state.quests||!Array.isArray(state.quests.claimed)||!Array.isArray(state.quests.modes))state.quests={date:day(),rounds:0,modes:[],claimed:[]};
function day(){return new Date().toISOString().slice(0,10)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function money(n){return Number(n||0).toLocaleString('ru-RU')}
function lvl(){return 1+Math.floor(state.xp/250)}
function snack(msg){toast=msg;render();setTimeout(function(){toast='';render()},2600)}
function change(delta,type){if(state.balance+delta<0)throw Error('Недостаточно LC');state.balance+=delta;if(delta>0)state.earned+=delta;state.history.unshift({delta:delta,type:type});state.history=state.history.slice(0,16)}
function round(kind){state.spins++;state.xp+=5;state.modeStats[kind]=(Number(state.modeStats[kind])||0)+1;dailyQuest();state.quests.rounds++;if(state.quests.modes.indexOf(kind)<0)state.quests.modes.push(kind);[['first',1],['ten',10],['fifty',50],['hundred',100]].forEach(function(a){if(state.spins>=a[1]&&state.ach.indexOf(a[0])<0)state.ach.push(a[0])})}
function dailyQuest(){if(state.quests.date!==day())state.quests={date:day(),rounds:0,modes:[],claimed:[]}}
function consecutiveDaily(){if(!state.daily)return 1;var previous=Date.parse(state.daily+'T00:00:00Z'),current=Date.parse(day()+'T00:00:00Z');return Number.isFinite(previous)&&current-previous===86400000?Math.min(999,state.streak+1):1}
function dailyReward(){return 500+Math.min(6,Math.max(0,consecutiveDaily()-1))*50}
function mMult(n){if(!n)return 0;var chance=1;for(var i=0;i<n;i++)chance*=(22-i)/(25-i);return Math.floor(90/chance)/100}
function slotForMultiplier(x){return ({0:3,0.5:5,1:2,2:1,3:0})[String(x)]??3}
function pathForSlot(slot){var target=7+slot*14.3,arr=[];for(var row=0;row<6;row++){var progress=(row+1)/7,center=48+(target-48)*progress,zig=(row%2===0?1:-1)*(7-progress*5);arr.push(Math.max(7,Math.min(91,center+zig)).toFixed(1)+'%')}return arr}
function wheelAngle(slot){return (2160-(slot*60+30))+'deg'}
function choose(list){var total=0;list.forEach(function(a){total+=a[1]});var r=Math.random()*total;for(var i=0;i<list.length;i++){r-=list[i][1];if(r<0)return list[i][0]}return list[list.length-1][0]}
function crashMult(){return Math.min(100,Math.max(1,Math.floor((1+(Date.now()-state.crash.start)/3000)*100)/100))}
function settle(){if(state.crash&&crashMult()>=state.crash.point){lastResult='💥 CRASH ×'+state.crash.point;state.crash=null;round('crash');save();return true}return false}
function act(type,value){try{
 if(type==='nav'){screen=value;lastResult='';lost=[]}
 if(type==='mode'){screen='mode';mode=value;lastResult='';lost=[]}
 if(type==='back'){screen='city';lastResult=''}
 if(type==='stake')stake=Number(value);
 if(type==='reset'){if(confirm('Сбросить все тестовые монеты и прогресс?')){state=fresh();screen='city';lastResult='';lost=[];plinkoSlot=-1;wheelSlot=-1}}
 if(type==='daily'){if(state.daily===day())throw Error('Подарок уже получен');var gift=dailyReward();state.streak=consecutiveDaily();state.streakBest=Math.max(state.streakBest,state.streak);change(gift,'Подарок · день '+state.streak);state.daily=day();snack('🔥 Серия '+state.streak+' дн. · +'+gift+' LC')}
 if(type==='plinko'){settle();if(state.mines||state.crash)throw Error('Завершите активный раунд');if(ball)throw Error('Шарик ещё падает');change(-stake,'Plinko');var x=choose([[0,20],[.5,30],[1,30],[2,15],[3,5]]);var win=Math.floor(stake*x);if(win)change(win,'Plinko выигрыш');round('plinko');plinkoSlot=slotForMultiplier(x);plinkoPath=pathForSlot(plinkoSlot);ball=true;lastResult='';save();setTimeout(function(){ball=false;lastResult='🎉 ×'+x+' · '+win+' LC';render()},1930)}
 if(type==='wheel'){if(spinning)throw Error('Колесо вращается');if(state.wheel===day())throw Error('Колесо сегодня уже вращалось');var prize=choose([[0,10],[50,30],[100,30],[150,20],[300,8],[500,2]]);if(prize)change(prize,'Колесо');state.wheel=day();round('wheel');wheelSlot=[0,50,100,150,300,500].indexOf(prize);wheelTurn=wheelAngle(wheelSlot);spinning=true;wheelReveal=false;lastResult='';save();setTimeout(function(){spinning=false;wheelReveal=true;lastResult='🎁 '+(prize?'+'+prize+' LC':'Попробуй завтра!');render()},2470)}
 if(type==='mines-start'){if(state.mines||state.crash)throw Error('Завершите активный раунд');var bet=Math.min(stake,200);change(-bet,'Mines');var arr=Array.from({length:25},function(_,i){return i});for(var i=24;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp}state.mines={stake:bet,bombs:arr.slice(0,3),opened:[]};lost=[];lastResult=''}
 if(type==='reveal'){var m=state.mines,cell=Number(value);if(!m||m.opened.indexOf(cell)>=0)throw Error('Недоступная клетка');if(m.bombs.indexOf(cell)>=0){lost=m.bombs;state.mines=null;round('mines');lastResult='💥 Мина! Раунд завершён'}else{m.opened.push(cell);if(m.opened.length===12){var payout=Math.floor(m.stake*mMult(12));change(payout,'Mines выигрыш');state.mines=null;round('mines');lastResult='💎 +'+payout+' LC'}}}
 if(type==='mines-cash'){var m=state.mines;if(!m||!m.opened.length)throw Error('Откройте безопасную клетку');var reward=Math.floor(m.stake*mMult(m.opened.length));change(reward,'Mines выигрыш');state.mines=null;round('mines');lastResult='💎 +'+reward+' LC'}
 if(type==='crash-start'){settle();if(state.crash||state.mines)throw Error('Завершите активный раунд');change(-stake,'Crash');var r=Math.random();state.crash={stake:stake,start:Date.now(),point:r<.1?1:Math.min(100,Math.floor(90/(1-r))/100)};lastResult=''}
 if(type==='crash-cash'){if(!state.crash)throw Error('Нет активного раунда');var mult=crashMult();if(mult>=state.crash.point){lastResult='💥 CRASH ×'+state.crash.point;state.crash=null;round('crash')}else{var pay=Math.floor(state.crash.stake*mult);change(pay,'Crash выигрыш');state.crash=null;round('crash');lastResult='🚀 +'+pay+' LC'}}
 if(type==='claim'){dailyQuest();var q=qs.find(function(x){return x[0]===value});var p=q[0]==='different2'?state.quests.modes.length:state.quests.rounds;if(p<q[2]||state.quests.claimed.indexOf(value)>=0)throw Error('Задание ещё не доступно');state.quests.claimed.push(value);change(100,'Задание');snack('⭐ +100 LC')}
 if(type==='club'){var input=document.getElementById('clubname');var name=(input&&input.value||'').trim();if(name.length<3||name.length>24)throw Error('Название клуба: 3–24 символа');state.club=name;snack('Клуб создан в демоверсии')}
 if(type==='leave'){state.club=null;snack('Вы вышли из клуба')}
 save();render();
 }catch(e){snack(e.message||'Ошибка действия')}
}
function el(tag,c){return '<'+tag+'>'+c+'</'+tag+'>'}
function button(label,action,value,cl,disabled){return '<button class="'+(cl||'')+'" data-action="'+action+'" data-value="'+(value||'')+'"'+(disabled?' disabled':'')+'>'+label+'</button>'}
function heading(title,sub){return '<div class="heading"><h2>'+title+'</h2><span>'+(sub||'')+'</span></div>'}
function cards(){return MODES.map(function(m,i){return '<button class="mode" data-action="mode" data-value="'+m[0]+'"><span class="ico">'+m[1]+'</span><span class="cardtag">'+['АРКАДА','ЛОГИКА','СКОРОСТЬ','ПОДАРКИ'][i]+'</span><b>'+m[2]+'</b><small>'+m[3]+'</small><span class="open">ОТКРЫТЬ РЕЖИМ ↗</span></button>'}).join('')}
function city(){var html='<section class="hero deluxe"><div class="eyebrow">✦ LUCKY CITY · DELUXE</div><h1>Твоя удача.<br><span>Твои правила.</span></h1><p>Открывай районы, собирай награды и испытания в неоновом городе.</p><div class="cityscape"><div class="citymoon"></div>'+Array.from({length:7},function(){return '<div class="building"></div>'}).join('')+'</div></section>';
 html+=heading('Игровые залы','4 уникальных режима')+'<div class="grid">'+cards()+'</div>';
 html+=heading('Районы города','Уровень '+lvl())+'<div class="grid">';
 DIST.forEach(function(d){var open=lvl()>=d[2];html+='<div class="panel district '+(open?'':'locked')+'"><i>'+(open?d[0]:'🔒')+'</i><div><strong>'+d[1]+'</strong><small>'+(open?'Доступен':'Открывается на ур. '+d[2])+'</small></div></div>'});html+='</div>';
 var within=state.xp%250;html+='<div class="panel"><div class="panel-row"><strong>⭐ Прогресс уровня</strong><small>'+within+' / 250 XP</small></div><div class="levelProgress"><span style="width:'+(within/250*100)+'%"></span></div></div>';
 html+=heading('Сезонные достижения',state.xp+' XP')+'<div class="badges"><div><span>'+(state.xp>=50?'🥉':'🔒')+'</span>Бронза · 50 XP</div><div><span>'+(state.xp>=250?'🥈':'🔒')+'</span>Серебро · 250 XP</div><div><span>'+(state.xp>=750?'🥇':'🔒')+'</span>Золото · 750 XP</div></div>';
 html+='<div class="panel streakPanel"><div class="panel-row"><div><span class="subtitle">🔥 СЕРИЯ ВХОДОВ</span><strong class="streakTitle">'+(state.daily===day()?state.streak:consecutiveDaily()-1)+' дней подряд</strong><small>Максимум: '+state.streakBest+' дней · До 800 LC в день</small></div><span class="streakFire">🔥</span></div><div class="streakDays">'+Array.from({length:7},function(_,i){return '<span class="'+(i<Math.min(7,state.daily===day()?state.streak:consecutiveDaily()-1)?'claimed':'')+'">'+(i+1)+'</span>'}).join('')+'</div><div class="panel-row" style="margin-top:14px"><div><strong>🎁 Ежедневный подарок</strong><small>'+(state.daily===day()?'Сегодня уже получен':'Награда: '+dailyReward()+' LC')+'</small></div>'+button(state.daily===day()?'Получено':'+'+dailyReward()+' LC','daily','','',state.daily===day())+'</div></div>';return html}
function modes(){var m=MODES.find(function(x){return x[0]===mode});var h=button('‹ Назад в город','back','','back')+'<div class="modehead"><div class="ico">'+m[1]+'</div><h1>'+m[2]+'</h1><p>'+m[3]+'</p></div>';
 if(mode==='plinko'){h+='<div class="board"><div class="plinko">'+(ball?'<div class="ball deluxeBall" style="--end:'+(7+plinkoSlot*14.3)+'%;'+plinkoPath.map(function(v,i){return '--x'+(i+1)+':'+v}).join(';')+'"></div>':'');for(var i=0;i<8;i++){h+='<div class="pins">'+Array.from({length:i+3},function(){return '<i></i>'}).join('')+'</div>'}h+='<div class="bins">'+['×3','×2','×1','×0','×1','×0.5','×3'].map(function(x,i){return '<span class="'+(!ball&&plinkoSlot===i?'hit':'')+'">'+x+'</span>'}).join('')+'</div></div><p class="muted">Падение шарика синхронизировано с итоговой ячейкой. В демо исход выбирается до анимации.</p></div>'}
 if(mode==='mines'){h+='<div class="mines">';for(var j=0;j<25;j++){var safe=state.mines&&state.mines.opened.indexOf(j)>=0,bad=lost.indexOf(j)>=0;h+=button(safe?'💎':bad?'💣':'✧','reveal',String(j),'cell '+(safe?'safe':bad?'bad':''),!state.mines||safe||bad)}h+='</div>';if(state.mines){var opened=state.mines.opened.length;h+='<div class="payoutDetails"><span>💎 Открыто '+opened+' из 12 безопасных клеток<br><small class="muted">Множитель: ×'+mMult(opened).toFixed(2)+'</small></span><strong>'+(opened?money(Math.floor(state.mines.stake*mMult(opened))):'0')+' LC</strong></div>'}h+='<p class="muted">3 мины · 5×5 · Забирай накопленный выигрыш до попадания на мину.</p>'}
 if(mode==='crash'){var multi=state.crash?crashMult():1;h+='<div class="board crashDeluxe"><div class="crashTrail"></div><svg class="crashGraph" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true"><path class="area" id="crasharea" d="M 5 190 L 25 184 L 50 174 L 75 160 L 100 140 L 130 115 L 165 85 L 205 42 L 235 15 L 235 190 Z"></path><path class="line" id="crashline" d="M 5 190 L 25 184 L 50 174 L 75 160 L 100 140 L 130 115 L 165 85 L 205 42 L 235 15"></path></svg><div class="crashRocket" id="crashrocket" style="--rx:'+(state.crash?Math.min(80,8+(multi-1)*13):8)+'%;--ry:'+(state.crash?Math.min(76,8+(multi-1)*13):8)+'%">🚀</div><div class="mult" id="crashnum">×'+multi.toFixed(2)+'</div><p class="crashHUD">'+(state.crash?'ЗАБЕРИ ВОВРЕМЯ':'ГОТОВ К ПОЛЁТУ?')+'</p></div><div class="payoutDetails"><span>🚀 '+(state.crash?'Текущий возможный выигрыш':'Тестовая игра, без реальных ставок')+'</span><strong id="crashpay">'+(state.crash?money(Math.floor(state.crash.stake*multi))+' LC':'—')+'</strong></div>'}
 if(mode==='wheel'){var prizeLabels=['0','50','100','150','300','500'];h+='<div class="board"><div class="pointer">▼</div><div class="wheel '+(spinning?'slotSpin':'')+'" style="--wheel-turn:'+wheelTurn+';transform:rotate('+(!spinning&&wheelSlot>=0?wheelTurn:'0deg')+')">'+prizeLabels.map(function(x,i){return '<span class="wheelPrize" style="--slot-angle:'+(i*60+30)+'deg">'+x+'</span>'}).join('')+'<div class="wheelcore">LUCKY<br>CITY</div></div><p class="muted">Бесплатно один раз в день · 6 призовых секторов</p></div>'}
 if(lastResult)h+='<div class="result">'+lastResult+'</div>';
 if(mode!=='wheel'){h+='<div class="stake"><b>💰 Ставка · тестовые LC</b><div class="stakeButtons">'+[10,50,100,200,500].filter(function(x){return mode!=='mines'||x<=200}).map(function(x){return button(x,'stake',String(x),stake===x?'active':'')}).join('')+'</div></div>'}
 if(mode==='plinko')h+=button(ball?'🔮 Шарик падает...':'🔮 Запустить за '+stake+' LC','plinko','','primary',ball);
 if(mode==='wheel')h+=button(spinning?'🎡 Вращаем...':state.wheel===day()?'Сегодня уже вращали':'🎡 Вращать бесплатно','wheel','','primary',state.wheel===day()||spinning);
 if(mode==='mines')h+=state.mines?button('💎 Забрать '+money(Math.floor(state.mines.stake*mMult(state.mines.opened.length)))+' LC','mines-cash','','primary',!state.mines.opened.length):button('💎 Начать за '+Math.min(stake,200)+' LC','mines-start','','primary');
 if(mode==='crash')h+=state.crash?button('🚀 Забрать множитель','crash-cash','','primary'):button('🚀 Запустить за '+stake+' LC','crash-start','','primary');
 return h}
function quest(){dailyQuest();var completed=state.quests.claimed.length;var h='<div class="panel questHero"><span class="subtitle">✦ ЕЖЕДНЕВНЫЙ ПРОГРЕСС</span><h2>Собери все награды</h2><p class="muted">Выполняй задания и получай по 100 виртуальных LC за каждое.</p><div class="levelProgress"><span style="width:'+(completed/3*100)+'%"></span></div><small>'+completed+' / 3 наград собрано</small></div>';
 h+=heading('Ежедневные задания','+100 LC за каждое');qs.forEach(function(q){var n=q[0]==='different2'?state.quests.modes.length:state.quests.rounds,done=state.quests.claimed.indexOf(q[0])>=0,progress=Math.min(n,q[2]);h+='<div class="panel questCard"><div class="panel-row"><div><strong>⭐ '+q[1]+'</strong><small>'+progress+' / '+q[2]+' · '+(done?'Награда получена':'100 LC')+'</small></div>'+button(done?'✓ Готово':n>=q[2]?'Забрать':'В процессе','claim',q[0],'',done||n<q[2])+'</div><div class="levelProgress"><span style="width:'+(progress/q[2]*100)+'%"></span></div></div>'});
 h+=heading('Достижения','За раунды');[['first','Первый шаг',1],['ten','Завсегдатай',10],['fifty','Житель города',50],['hundred','Легенда улиц',100]].forEach(function(a){h+='<div class="panel panel-row"><div><strong>🏆 '+a[1]+'</strong><small>'+(state.ach.includes(a[0])?'Открыто':'Раундов: '+Math.min(state.spins,a[2])+' / '+a[2])+'</small></div><span>'+(state.ach.indexOf(a[0])>=0?'✅':'🔒')+'</span></div>'});return h}
function rating(){var xp=tab==='season'?state.xp:state.xp;return heading('Рейтинг города','Демо')+'<p class="muted">Здесь только ваш тестовый профиль. В демо нет реальных игроков.</p><div class="panel panel-row"><strong>🥇 Вы (демо)</strong><strong>'+money(xp)+' XP</strong></div>'}
function clubs(){var h='<div class="panel clubHero"><span class="subtitle">🏰 КЛУБНАЯ ИМПЕРИЯ</span><h2>'+(state.club?'👑 '+escapeText(state.club):'Создай свою команду')+'</h2><p class="muted">Построй клуб, собирай очки опыта и поднимайся к вершине города.</p><div class="clubHerobadges"><span>⭐ '+money(state.xp)+' XP</span><span>👥 '+(state.club?'1 / 30':'0 / 30')+'</span><span>🏆 Локальное демо</span></div></div>';
 if(state.club)h+='<div class="panel panel-row"><div><strong>Вы — основатель клуба</strong><small>Эмблема и прогресс сохранены на устройстве</small></div>'+button('Выйти','leave','','ghost')+'</div>';else h+='<div class="panel"><strong>Создать тестовый клуб</strong><p class="muted">Выбери название. Других игроков в демоверсии нет.</p><input class="input" id="clubname" maxlength="24" placeholder="Например: Neon Legends">'+button('🏰 Создать бесплатно','club','','primary')+'</div>';
 h+=heading('Чемпионат клубов','Сезон 1')+'<div class="panel panel-row"><div><strong>'+(state.club?'🥇 '+escapeText(state.club):'🏆 Начни свою историю')+'</strong><small>'+(state.club?'1 участник · локальный рейтинг':'Пока ни одного клуба')+'</small></div><strong style="color:#f6cd83">'+(state.club?money(state.xp)+' XP':'—')+'</strong></div>';
 h+='<p class="muted">Данные клубов в этой версии хранятся только в браузере. Сетевые соревнования появятся после подключения игрового сервера.</p>';return h}
function escapeText(value){return String(value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function profile(){var level=lvl(),within=state.xp%250,rank=level>=25?'👑 ЛЕГЕНДА':level>=12?'💎 ЭЛИТА':level>=5?'🥇 ИССЛЕДОВАТЕЛЬ':'🥉 НОВИЧОК';var h='<div class="board" style="padding:25px"><span class="medal">👑</span><div class="subtitle">ПАСПОРТ ЖИТЕЛЯ</div><h2 style="font-size:28px;margin:10px 0">Мой профиль</h2><strong style="color:#f5ce81">'+rank+'</strong><p class="muted">Уровень '+level+' · '+money(state.xp)+' XP</p><div class="levelProgress"><span style="width:'+(within/250*100)+'%"></span></div><p class="muted">До следующего уровня: '+(250-within)+' XP</p></div>';
 h+='<div class="statgrid" style="margin-top:14px"><div><small>🎮 Всего раундов</small><strong>'+money(state.spins)+'</strong></div><div><small>💰 Получено LC</small><strong>'+money(state.earned)+'</strong></div><div><small>⭐ Уровень</small><strong>'+level+'</strong></div><div><small>🏆 Достижения</small><strong>'+state.ach.length+'/4</strong></div></div>';
 h+=heading('Коллекция достижений','За игровые раунды')+'<div class="badges"><div><span>'+(state.ach.includes('first')?'🏅':'🔒')+'</span>Первый шаг</div><div><span>'+(state.ach.includes('ten')?'🥈':'🔒')+'</span>10 раундов</div><div><span>'+(state.ach.includes('fifty')?'🏆':'🔒')+'</span>50 раундов</div></div>';
 h+=heading('Статистика игровых режимов','Раунды')+'<div class="modeStats">'+MODES.map(function(m){return '<div><span>'+m[1]+'</span><strong>'+money(state.modeStats[m[0]]||0)+'</strong><small>'+m[2]+'</small></div>'}).join('')+'</div>';
 h+='<div class="panel panel-row"><div><strong>🔥 Рекорд серии входов</strong><small>Ежедневные подарки</small></div><strong>'+state.streakBest+' дн.</strong></div>';
 h+=heading('История операций','Только локальные LC');h+=state.history.length?state.history.map(function(x){return '<div class="panel panel-row"><small>'+escapeText(x.type)+'</small><strong style="color:'+(x.delta>0?'#9eeac9':'#eec6d5')+'">'+(x.delta>0?'+':'')+x.delta+' LC</strong></div>'}).join(''):'<div class="panel">История пока пуста</div>';return h}
function render(){var app=document.getElementById('app');if(!app)return;var h='<div class="demo"><div><strong>🎮 LUCKY CITY DELUXE 1.1</strong><small>Только виртуальные монеты · без регистрации</small></div>'+button('Сбросить','reset','','ghost')+'</div>';
 h+='<header class="top"><div><div class="brand">✦ LUCKY <span>CITY</span></div><div class="sub">ГОРОД ТВОЕЙ УДАЧИ</div></div>'+button('👑','nav','profile','avatar')+'</header>';
 h+='<div class="wallet"><div><small>💰 LUCKY COINS</small><strong>'+money(state.balance)+' <em>LC</em></strong></div><div class="lvl"><small>⭐ РЕПУТАЦИЯ</small><strong>Ур. '+lvl()+'</strong></div></div>';
 h+=screen==='city'?city():screen==='mode'?modes():screen==='quests'?quest():screen==='rating'?rating():screen==='clubs'?clubs():profile();
 h+='<footer>ПРЕДПРОСМОТР · без сервера, платежей и реальных призов</footer><div class="nav">'+[['city','🏙️','Город'],['quests','🎁','Награды'],['rating','🏆','Рейтинг'],['clubs','🏰','Клубы'],['profile','👤','Профиль']].map(function(x){return button('<span>'+x[1]+'</span><small>'+x[2]+'</small>','nav',x[0],screen===x[0]?'active':'')}).join('')+'</div>';
 if(toast)h+='<div class="toast">'+escapeText(toast)+'</div>';app.innerHTML=h}
document.addEventListener('click',function(e){var b=e.target.closest('button[data-action]');if(b&&!b.disabled)act(b.dataset.action,b.dataset.value)});
function animateCrashGraph(){
 if(!state.crash)return;
 var mult=crashMult(),elapsed=Math.max(0,Date.now()-state.crash.start),fraction=Math.min(1,elapsed/12000),lastX=5+fraction*285,lastY=Math.max(9,190-Math.pow(fraction,.85)*176);
 var pts=[];for(var i=0;i<=18;i++){var k=i/18,x=5+(lastX-5)*k,y=190-(190-lastY)*Math.pow(k,1.55);pts.push([x.toFixed(1),y.toFixed(1)])}
 var d='M '+pts.map(function(p){return p.join(' ')}).join(' L ');
 var line=document.getElementById('crashline'),area=document.getElementById('crasharea'),rocket=document.getElementById('crashrocket');
 if(line)line.setAttribute('d',d);
 if(area)area.setAttribute('d',d+' L '+lastX.toFixed(1)+' 190 Z');
 if(rocket){rocket.style.left=(lastX/300*100).toFixed(1)+'%';rocket.style.bottom=((200-lastY)/200*90).toFixed(1)+'%'}
 var n=document.getElementById('crashnum'),pay=document.getElementById('crashpay');
 if(n)n.textContent='×'+mult.toFixed(2);
 if(pay)pay.textContent=money(Math.floor(state.crash.stake*mult))+' LC';
}
setInterval(function(){if(state.crash){if(settle())render();else animateCrashGraph()}},180);
save();render();
})();
</script></body></html>
