var SUITS=['♠','♥','♣','♦'],RED_NUMBERS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

function startBlackjack(){casinoStake('Blackjack');var g={stake:stake,deck:deck52(),player:[],dealer:[]};g.player=[draw(g),draw(g)];g.dealer=[draw(g),draw(g)];state.blackjack=g;lastResult='';save();if(handScore(g.player)===21||handScore(g.dealer)===21)finishBlackjack()}

function pokerRank(cards){var ranks=cards.map(function(c){return c.r}).sort(function(a,b){return a-b}),counts={},flush=cards.every(function(c){return c.s===cards[0].s});ranks.forEach(function(r){counts[r]=(counts[r]||0)+1});var frequency=Object.values(counts).sort(function(a,b){return b-a}),unique=[...new Set(ranks)],straight=unique.length===5&&(unique[4]-unique[0]===4||unique.join(',')==='2,3,4,5,14');if(flush&&straight&&ranks[0]===10)return ['Роял-флеш',250];if(flush&&straight)return ['Стрит-флеш',50];if(frequency[0]===4)return ['Каре',25];if(frequency[0]===3&&frequency[1]===2)return ['Фулл-хаус',9];if(flush)return ['Флеш',6];if(straight)return ['Стрит',4];if(frequency[0]===3)return ['Сет',3];if(frequency[0]===2&&frequency[1]===2)return ['Две пары',2];if(Object.keys(counts).some(function(r){return +r>=11&&counts[r]===2}))return ['Валеты или выше',1];return ['Без комбинации',0]}

function animateCrashGraph(){
 if(!state.crash)return;
 var mult=crashMult(),elapsed=Math.max(0,Date.now()-state.crash.start),fraction=Math.min(1,elapsed/12000),lastX=5+fraction*285,lastY=Math.max(9,190-Math.pow(fraction,.85)*176);
 var pts=[];for(var i=0;i<=18;i++){var k=i/18,x=5+(lastX-5)*k,y=190-(190-lastY)*Math.pow(k,1.55);pts.push([x.toFixed(1),y.toFixed(1)])}
 var d='M '+pts.map(function(p){return p.join(' ')}).join(' L ');
 var line=document.getElementById('crashline'),area=document.getElementById('crasharea'),rocket=document.getElementById('crashrocket');
 if(line)line.setAttribute('d',d);
 if(area)area.setAttribute('d',d+' L '+lastX.toFixed(1)+' 190 Z');
 if(rocket){rocket.style.left=(lastX/300*100).toFixed(1)+'%';rocket.style.bottom=((200-lastY)/200*90).toFixed(1)+'%'}
 var n=document.getElementById('crashnum'),pay=document.getElementById('crashpay');
 if(n)n.textContent='×'+mult.toFixed(2);
 if(pay)pay.textContent=money(Math.floor(state.crash.stake*mult))+' LC';
}
setInterval(function(){if(state.crash){if(settle()){render();setTimeout(render,940)}else animateCrashGraph()}},180);
